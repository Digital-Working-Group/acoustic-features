repos:
  # Credential / API-key scanning against a snapshot baseline.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: >
          (?x)^(
              \.secrets\.baseline|
              opensmile/comparison/.*|
              opensmile/output/.*|
              librosa/output/.*
          )$

  # Blocks accidental commits of large files (e.g. full-length raw audio),
  # sized above the largest de-identified sample data already checked in.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=51200"] # 50 MiB

  # Org-specific sensitive identifiers (e.g. participant IDs) that generic
  # secret scanners have no way to recognize.
  - repo: local
    hooks:
      - id: check-sensitive-patterns
        name: check for organization-specific sensitive identifiers
        entry: python scripts/check_sensitive_patterns.py
        language: python
        pass_filenames: false
        stages: [pre-commit]
